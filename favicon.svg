<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tbfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7c78"/>
      <stop offset="50%" stop-color="#0b6b68"/>
      <stop offset="100%" stop-color="#064441"/>
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base with Rich Teal Gradient -->
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#tbfBg)" filter="url(#shadow)"/>
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="3" y="3" width="58" height="58" rx="13" ry="13" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.25"/>

  <!-- Golden Tanzanian Trade Growth Arc -->
  <path d="M 12 48 Q 32 44 52 48" stroke="url(#goldAcc)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  
  <!-- Micro Star / Sparkle in Top Right -->
  <polygon points="50,14 51.5,17.5 55,19 51.5,20.5 50,24 48.5,20.5 45,19 48.5,17.5" fill="url(#goldAcc)"/>

  <!-- Bold TBF Typography -->
  <text x="32" y="38" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Oswald', 'Montserrat', sans-serif" 
        font-size="20" 
        font-weight="900" 
        letter-spacing="0.08em" 
        fill="#ffffff" 
        text-anchor="middle"
        dominant-baseline="central">TBF</text>
</svg>
